# Postgres and Redis for the claude-agent user's checkouts. They hold only
# seed and test data, never a production restore. Started by
# claude-agent/setup: docker compose -p claude-agent -f compose.yml up -d
services:
  postgres:
    image: pgvector/pgvector:pg18-trixie
    shm_size: 2gb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - pg_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5436:5432"
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust

  redis:
    image: redis:8
    restart: unless-stopped
    ports:
      - "127.0.0.1:6393:6379"

volumes:
  pg_data:
